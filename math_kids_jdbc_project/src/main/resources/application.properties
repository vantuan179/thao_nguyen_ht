spring.application.name=math-kids
server.port=8080

# PostgreSQL DataSource
spring.datasource.url=jdbc:postgresql://localhost:5432/mathkids
spring.datasource.username=pg
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# JDBC connection pool (default Tomcat JDBC pool is replaced by HikariCP in Spring Boot)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Jackson date format
spring.jackson.serialization.write-dates-as-timestamps=false

# Do not run schema/data.sql automatically (run schema.sql manually the first time)
spring.sql.init.mode=never